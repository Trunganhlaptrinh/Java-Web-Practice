<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SHOW - Đăng Nhập</title>
    <link rel="icon" type="image/png" href="/images/logo-the-show.png">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <nav class="navbar">
        <a href="/index.html" class="brand">
            <img src="/images/logo-the-show.png" alt="THE SHOW" style="height: 38px; width: auto; object-fit: contain;">
            <span class="brand-name">THE SHOW</span>
        </a>
        <div class="nav-actions" id="nav-actions"></div>
    </nav>

    <div class="container">
        <div class="auth-container">
            <h2 style="font-size: 26px; font-weight: 800; text-align: center; margin-bottom: 8px; color: #000000;">Đăng
                Nhập</h2>


            <form id="login-form" onsubmit="handleLogin(event)">
                <div style="margin-bottom: 18px;">
                    <label
                        style="font-size: 13px; font-weight: 700; display: block; margin-bottom: 6px; color: #111827;">Tên
                        đăng nhập hoặc Email</label>
                    <input type="text" id="username" class="form-input" placeholder="admin hoặc customer" required>
                </div>

                <div style="margin-bottom: 24px;">
                    <label
                        style="font-size: 13px; font-weight: 700; display: block; margin-bottom: 6px; color: #111827;">Mật
                        khẩu</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" id="btn-submit-login" style="width: 100%;">Đăng
                    Nhập</button>
            </form>

            <!-- Đường kẻ phân cách HOẶC chuẩn phong cách -->
            <div style="display: flex; align-items: center; margin: 24px 0 18px;">
                <div style="flex: 1; height: 1px; background: var(--border-light);"></div>
                <span
                    style="padding: 0 16px; font-size: 12px; font-weight: 800; color: #9CA3AF; letter-spacing: 1px;">HOẶC</span>
                <div style="flex: 1; height: 1px; background: var(--border-light);"></div>
            </div>

            <!-- Nút Facebook & Google -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;">
                <button type="button" onclick="FirebaseAuthHelper.loginWithFacebook()" class="btn btn-secondary"
                    style="display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 13px; padding: 10px 14px;">
                    <svg style="width: 18px; height: 18px; fill: #1877F2;" viewBox="0 0 24 24">
                        <path
                            d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
                    </svg>
                    <span>Facebook</span>
                </button>
                <button type="button" onclick="FirebaseAuthHelper.loginWithGoogle()" class="btn btn-secondary"
                    style="display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 13px; padding: 10px 14px;">
                    <svg style="width: 18px; height: 18px;" viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" />
                        <path fill="#34A853"
                            d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" />
                        <path fill="#FBBC05"
                            d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.03 0 12s.45 3.82 1.25 5.42l4.03-3.15z" />
                        <path fill="#EA4335"
                            d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" />
                    </svg>
                    <span>Google</span>
                </button>
            </div>



            <div
                style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-light); text-align: center; font-size: 13px; color: var(--text-muted);">
                Chưa có tài khoản? <a href="/register.html"
                    style="color: #000000; font-weight: 700; text-decoration: underline;">Đăng ký ngay</a>
            </div>


        </div>
    </div>

    <div id="toast-container"></div>

        <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="/js/app.js"></script>
    <script>
        function fillDemo(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }



        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-login');
            btn.disabled = true;
            btn.textContent = 'Đang xác thực...';

            try {
                const res = await apiFetch('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({
                        usernameOrEmail: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });

                Auth.setToken(res.data.token);
                Auth.setUser({
                    id: res.data.userId,
                    username: res.data.username,
                    email: res.data.email,
                    fullName: res.data.fullName,
                    role: res.data.role
                });

                showToast('Đăng nhập thành công!', 'success');
                setTimeout(() => {
                    if (res.data.role === 'ADMIN') {
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/user.html';
                    }
                }, 1000);
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Đăng Nhập';
            }
        }
    </script>
</body>

</html>
