<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SHOW - Vé Của Tôi</title>
    <link rel="icon" type="image/png" href="/images/logo-the-show.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/index.html" class="brand">
            <img src="/images/logo-the-show.png" alt="THE SHOW" style="height: 38px; width: auto; object-fit: contain;">
            <span class="brand-name">THE SHOW</span>
        </a>
        <div class="nav-actions" id="nav-actions"></div>
    </nav>

    <div class="container" style="max-width: 900px;">
        <div style="margin-bottom: 32px;">
            <h1 style="font-size: 28px; font-weight: 900; color: #000000;">Vé Điện Tử Của Tôi</h1>
            <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">Xuất trình mã QR tại cổng soát vé để vào sự kiện</p>
        </div>

        <div id="tickets-container">
            <div style="text-align: center; padding: 48px; color: var(--text-muted); font-size: 14px;">Đang tải danh sách vé...</div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="/js/app.js"></script>
    <script src="/js/qrcode.min.js"></script>
    <script>
        async function loadTickets() {
            if (!Auth.isLoggedIn()) {
                window.location.href = '/login.html';
                return;
            }

            try {
                const res = await apiFetch('/tickets/my');
                const container = document.getElementById('tickets-container');
                if (!res.data || res.data.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 60px 20px; background: #FFFFFF; border-radius: var(--radius-lg); border: 1px solid var(--border-light); box-shadow: var(--shadow-sm);">
                            <h3 style="font-size: 20px; font-weight: 800; color: #000000; margin-bottom: 8px;">Bạn chưa sở hữu vé nào</h3>
                            <p style="color: var(--text-muted); margin-bottom: 24px; font-size: 14px;">Hãy khám phá các sự kiện âm nhạc đỉnh cao và săn vé ngay hôm nay!</p>
                            <a href="/index.html#concerts" class="btn btn-primary">Khám Phá Concert</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = res.data.map(t => `
                    <div class="ticket-card" id="ticket-${t.id}">
                        <div class="ticket-main">
                            <span style="display: inline-block; padding: 4px 12px; font-size: 11px; font-weight: 800; letter-spacing: 1px; border: 1px solid #000000; border-radius: var(--radius-full); margin-bottom: 12px;">VÉ HỢP LỆ • ${t.tierName}</span>
                            <h2 style="font-size: 22px; font-weight: 900; margin-bottom: 10px; color: #000000;">${t.concertTitle}</h2>
                            <div style="color: var(--text-body); font-size: 13px; margin-bottom: 18px; line-height: 1.8;">
                                <div><strong>Địa điểm:</strong> ${t.venue}</div>
                                <div><strong>Thời gian:</strong> ${formatDateTime(t.concertStartTime)}</div>
                            </div>
                            <div style="display: flex; gap: 32px; align-items: center; border-top: 1px solid var(--border-light); padding-top: 14px;">
                                <div>
                                    <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px;">SỐ GHẾ</div>
                                    <div style="font-size: 24px; font-weight: 900; color: #000000;">${t.seatCode}</div>
                                </div>
                                <div>
                                    <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px;">MÃ VÉ</div>
                                    <div style="font-size: 14px; font-weight: 800; color: #000000; font-family: monospace;">${t.ticketCode}</div>
                                </div>
                                <div>
                                    <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px;">GIÁ VÉ</div>
                                    <div style="font-size: 15px; font-weight: 800; color: #000000;">${formatCurrency(t.price)}</div>
                                </div>
                            </div>
                        </div>
                        <div class="ticket-qr">
                            <div class="qr-box" id="qr-box-${t.id}"></div>
                            <span style="font-size: 10px; font-weight: 700; color: var(--text-muted); margin-top: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Quét để xác thực</span>
                        </div>
                    </div>
                `).join('');

                res.data.forEach(t => {
                    const qrBox = document.getElementById(`qr-box-${t.id}`);
                    if (qrBox) {
                        const canvas = generateQRCodeCanvas(t.qrCodeData || t.ticketCode, 100);
                        qrBox.appendChild(canvas);
                    }
                });
            } catch (err) {
                showToast(err.message, 'error');
            }
        }
        document.addEventListener('DOMContentLoaded', loadTickets);
    </script>
</body>
</html>
