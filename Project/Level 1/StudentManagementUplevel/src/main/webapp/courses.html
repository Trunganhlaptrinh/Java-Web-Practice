<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Môn học</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Quản lý Môn học</h1>

        <div class="card">
            <h2 id="formTitle">Thêm môn học</h2>
            <form id="form" class="form-row">
                <input type="hidden" id="id">
                <div class="field">
                    <label for="name">Tên môn học</label>
                    <input id="name" required maxlength="150" placeholder="VD: Java Programming">
                </div>
                <div class="field">
                    <label for="departmentId">Khoa</label>
                    <select id="departmentId" required></select>
                </div>
                <button class="btn primary" type="submit">Lưu</button>
                <button class="btn" type="button" id="btnCancel">Hủy</button>
            </form>
        </div>

        <div class="card">
            <form id="searchForm" class="toolbar">
                <input id="keyword" placeholder="Tìm theo tên môn học...">
                <button class="btn" type="submit">Tìm</button>
                <button class="btn" type="button" id="btnClearSearch">Xóa lọc</button>
            </form>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>ID</th><th>Tên môn</th><th>Khoa</th><th>Thao tác</th></tr></thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Hop thoai quan ly giao vien cua 1 mon (bang course_teacher) -->
    <dialog id="dlg">
        <div class="dialog-head">
            <h2 id="dlgTitle">Giáo viên</h2>
            <button class="btn small" id="btnClose" type="button">Đóng</button>
        </div>
        <div class="toolbar">
            <select id="dlgTeacher"></select>
            <button class="btn primary" id="btnAssign" type="button">Gán</button>
        </div>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Giáo viên đang dạy</th><th></th></tr></thead>
                <tbody id="dlgBody"></tbody>
            </table>
        </div>
    </dialog>

    <script src="js/common.js"></script>
    <script>
        renderNav('courses');
        let cache = [];
        let currentCourseId = null; // course dang mo trong hop thoai

        async function loadDepartments() {
            try {
                const res = await apiCall('departments');
                fillSelect($('departmentId'), res.data, d => d.id, d => d.name, '-- Chọn khoa --');
            } catch (e) {
                toast(e.message, 'error');
            }
        }

        async function load() {
            try {
                const kw = $('keyword').value.trim();
                const res = await apiCall(kw ? 'courses?search=' + encodeURIComponent(kw) : 'courses');
                cache = res.data;
                $('tbody').innerHTML = cache.length
                    ? cache.map(c => `
                        <tr>
                            <td>${c.id}</td>
                            <td>${esc(c.name)}</td>
                            <td>${esc(c.departmentName)}</td>
                            <td class="actions">
                                <button class="btn small" data-action="teachers" data-id="${c.id}">Giáo viên</button>
                                <a class="btn small" href="enrollments.html?courseId=${c.id}">Sinh viên</a>
                                <button class="btn small" data-action="edit" data-id="${c.id}">Sửa</button>
                                <button class="btn small danger" data-action="delete" data-id="${c.id}">Xóa</button>
                            </td>
                        </tr>`).join('')
                    : '<tr><td colspan="4" class="empty">Không có môn học nào</td></tr>';
            } catch (e) {
                toast(e.message, 'error');
            }
        }

        function resetForm() {
            $('form').reset();
            $('id').value = '';
            $('formTitle').textContent = 'Thêm môn học';
        }

        $('form').addEventListener('submit', async ev => {
            ev.preventDefault();
            const id = $('id').value;
            const body = {
                name: $('name').value.trim(),
                departmentId: Number($('departmentId').value)
            };
            try {
                let res;
                if (id) {
                    body.id = Number(id);
                    res = await apiCall('courses', 'PUT', body);
                } else {
                    res = await apiCall('courses', 'POST', body);
                }
                toast(res.message, 'success');
                resetForm();
                load();
            } catch (e) {
                toast(e.message, 'error');
            }
        });

        $('btnCancel').addEventListener('click', resetForm);

        $('searchForm').addEventListener('submit', ev => { ev.preventDefault(); load(); });
        $('btnClearSearch').addEventListener('click', () => { $('keyword').value = ''; load(); });

        $('tbody').addEventListener('click', async ev => {
            const btn = ev.target.closest('button[data-action]');
            if (!btn) return;
            const id = Number(btn.dataset.id);
            const course = cache.find(x => x.id === id);

            if (btn.dataset.action === 'edit') {
                $('id').value = course.id;
                $('name').value = course.name;
                $('departmentId').value = course.departmentId;
                $('formTitle').textContent = 'Sửa môn học #' + course.id;
                $('name').focus();
            } else if (btn.dataset.action === 'delete') {
                if (!confirm('Xóa môn học này?')) return;
                try {
                    const res = await apiCall('courses?id=' + id, 'DELETE');
                    toast(res.message, 'success');
                    load();
                } catch (e) {
                    toast(e.message, 'error'); // vd: con sinh vien dang ky
                }
            } else if (btn.dataset.action === 'teachers') {
                openTeacherDialog(course);
            }
        });

        // ---------- hop thoai gan / go giao vien ----------
        async function openTeacherDialog(course) {
            currentCourseId = course.id;
            $('dlgTitle').textContent = 'Giáo viên dạy: ' + course.name;
            $('dlg').showModal();
            try {
                const res = await apiCall('teachers');
                fillSelect($('dlgTeacher'), res.data, t => t.id,
                    t => t.name + ' (' + t.departmentName + ')', '-- Chọn giáo viên --');
            } catch (e) {
                toast(e.message, 'error');
            }
            loadCourseTeachers();
        }

        async function loadCourseTeachers() {
            try {
                const res = await apiCall('course-teachers?courseId=' + currentCourseId);
                $('dlgBody').innerHTML = res.data.length
                    ? res.data.map(ct => `
                        <tr>
                            <td>${esc(ct.teacherName)}</td>
                            <td><button class="btn small danger" data-teacher="${ct.teacherId}">Gỡ</button></td>
                        </tr>`).join('')
                    : '<tr><td colspan="2" class="empty">Chưa có giáo viên nào</td></tr>';
            } catch (e) {
                toast(e.message, 'error');
            }
        }

        $('btnAssign').addEventListener('click', async () => {
            const teacherId = Number($('dlgTeacher').value);
            if (!teacherId) { toast('Hãy chọn giáo viên', 'error'); return; }
            try {
                const res = await apiCall('course-teachers', 'POST',
                    { courseId: currentCourseId, teacherId: teacherId });
                toast(res.message, 'success');
                loadCourseTeachers();
            } catch (e) {
                toast(e.message, 'error');
            }
        });

        $('dlgBody').addEventListener('click', async ev => {
            const btn = ev.target.closest('button[data-teacher]');
            if (!btn) return;
            try {
                const res = await apiCall(
                    `course-teachers?courseId=${currentCourseId}&teacherId=${btn.dataset.teacher}`, 'DELETE');
                toast(res.message, 'success');
                loadCourseTeachers();
            } catch (e) {
                toast(e.message, 'error');
            }
        });

        $('btnClose').addEventListener('click', () => $('dlg').close());

        loadDepartments().then(load);
    </script>
</body>
</html>
