<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sinh viên</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Quản lý Sinh viên</h1>

        <div class="card">
            <h2 id="formTitle">Thêm sinh viên</h2>
            <form id="form" class="form-row">
                <input type="hidden" id="id">
                <div class="field">
                    <label for="name">Tên sinh viên</label>
                    <input id="name" required maxlength="100" placeholder="Chỉ chữ cái và khoảng trắng">
                </div>
                <div class="field">
                    <label for="semester">Học kỳ</label>
                    <input id="semester" required maxlength="20" placeholder="VD: HK1 2026">
                </div>
                <button class="btn primary" type="submit">Lưu</button>
                <button class="btn" type="button" id="btnCancel">Hủy</button>
            </form>
        </div>

        <div class="card">
            <form id="searchForm" class="toolbar">
                <input id="keyword" placeholder="Tìm theo tên (một phần tên cũng được)...">
                <button class="btn" type="submit">Tìm</button>
                <button class="btn" type="button" id="btnClearSearch">Xóa lọc</button>
            </form>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>ID</th><th>Tên</th><th>Học kỳ</th><th>Thao tác</th></tr></thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        renderNav('students');
        let cache = [];

        async function load() {
            try {
                const kw = $('keyword').value.trim();
                const res = await apiCall(kw ? 'students?search=' + encodeURIComponent(kw) : 'students');
                cache = res.data;
                $('tbody').innerHTML = cache.length
                    ? cache.map(s => `
                        <tr>
                            <td>${s.id}</td>
                            <td>${esc(s.name)}</td>
                            <td>${esc(s.semester)}</td>
                            <td class="actions">
                                <a class="btn small" href="enrollments.html?studentId=${s.id}">Môn đã đăng ký</a>
                                <button class="btn small" data-action="edit" data-id="${s.id}">Sửa</button>
                                <button class="btn small danger" data-action="delete" data-id="${s.id}">Xóa</button>
                            </td>
                        </tr>`).join('')
                    : '<tr><td colspan="4" class="empty">Không có sinh viên nào</td></tr>';
            } catch (e) {
                toast(e.message, 'error');
            }
        }

        function resetForm() {
            $('form').reset();
            $('id').value = '';
            $('formTitle').textContent = 'Thêm sinh viên';
        }

        $('form').addEventListener('submit', async ev => {
            ev.preventDefault();
            const id = $('id').value;
            const body = {
                name: $('name').value.trim(),
                semester: $('semester').value.trim()
            };
            try {
                let res;
                if (id) {
                    body.id = Number(id);
                    res = await apiCall('students', 'PUT', body);
                } else {
                    res = await apiCall('students', 'POST', body);
                }
                toast(res.message, 'success');
                resetForm();
                load();
            } catch (e) {
                toast(e.message, 'error');
            }
        });

        $('btnCancel').addEventListener('click', resetForm);
        $('searchForm').addEventListener('submit', ev => { ev.preventDefault(); load(); });
        $('btnClearSearch').addEventListener('click', () => { $('keyword').value = ''; load(); });

        $('tbody').addEventListener('click', async ev => {
            const btn = ev.target.closest('button[data-action]');
            if (!btn) return;
            const id = Number(btn.dataset.id);

            if (btn.dataset.action === 'edit') {
                const s = cache.find(x => x.id === id);
                $('id').value = s.id;
                $('name').value = s.name;
                $('semester').value = s.semester;
                $('formTitle').textContent = 'Sửa sinh viên #' + s.id;
                $('name').focus();
            } else if (btn.dataset.action === 'delete') {
                if (!confirm('Xóa sinh viên này? (các đăng ký môn của sinh viên cũng bị xóa)')) return;
                try {
                    const res = await apiCall('students?id=' + id, 'DELETE');
                    toast(res.message, 'success');
                    load();
                } catch (e) {
                    toast(e.message, 'error');
                }
            }
        });

        load();
    </script>
</body>
</html>
