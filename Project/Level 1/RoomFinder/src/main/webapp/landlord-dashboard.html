<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomFinder - Chủ nhà</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style type="text/tailwindcss">
        @layer base {
            body {
                font-family: "Inter Tight", sans-serif;
                background:
                    radial-gradient(circle at top left, rgba(194,153,104,.12), transparent 22%),
                    radial-gradient(circle at bottom right, rgba(150,110,84,.09), transparent 22%),
                    linear-gradient(180deg, oklch(96% 0.02 80), oklch(94% 0.018 80));
                color: #221f1a;
                min-height: 100vh;
            }
            h1,h2,h3,h4 { font-family: "Cormorant Garamond", serif; }
        }
        @layer utilities {
            .glass-smoke { backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }
            .btn-primary {
                display: inline-block;
                border-radius: 999px;
                background: linear-gradient(180deg, #5a4a3a, #3d3127);
                color: #fff;
                font-weight: 700;
                box-shadow: 0 4px 16px rgba(60,45,30,.25);
                transition: transform .3s ease, box-shadow .3s ease;
            }
            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 24px rgba(60,45,30,.35);
            }
            .btn-primary:active { transform: scale(0.97); }

            .tab-content { display: none; }
            .tab-content.active { display: block; }

            /* Tab active state */
            .tab-btn-active {
                background: linear-gradient(180deg, #5a4a3a, #3d3127);
                color: #fff;
                box-shadow: 0 4px 16px rgba(60,45,30,.25);
            }
            /* Tab inactive state */
            .tab-btn-inactive {
                background: rgba(255,255,255,.5);
                border: 2px solid #8b7355;
                color: #3d3127;
            }
            .tab-btn-inactive:hover {
                background: rgba(255,255,255,.8);
            }
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="images/logo.svg">
</head>
<body class="p-3 sm:p-6">
    <header class="fixed top-0 inset-x-0 z-50 px-3 sm:px-5 py-3 sm:py-5">
        <div class="mx-auto max-w-[1700px]">
            <div class="flex items-center justify-between rounded-2xl border border-white/40 bg-white/45 px-4 sm:px-6 py-3 sm:py-4 glass-smoke">
                <div>
                    <a href="index.html" class="text-[10px] uppercase tracking-[0.35em] text-[#6b6255] font-bold block">RoomFinder</a>
                    <div class="mt-1 text-xs sm:text-sm text-[#413a31]">Dành cho chủ nhà</div>
                </div>
                <div id="nav-links" class="flex items-center gap-2 sm:gap-4 text-xs sm:text-sm font-semibold text-[#5b5247]">
                    <!-- Render by JS -->
                </div>
            </div>
        </div>
    </header>

    <main class="mx-auto max-w-[1400px] mt-[100px] sm:mt-[120px] pb-20">
        
        <!-- Tab buttons -->
        <div class="flex gap-3 sm:gap-4 mb-8 sm:mb-10 justify-center flex-wrap">
            <button id="tab-manage-rooms" class="tab-btn-active rounded-full px-6 sm:px-8 py-3 sm:py-4 text-[11px] sm:text-[12px] uppercase tracking-[0.2em] font-bold transition-all" onclick="switchTab('manage-rooms')">Quản Lý Phòng</button>
            <button id="tab-manage-requests" class="tab-btn-inactive rounded-full px-6 sm:px-8 py-3 sm:py-4 text-[11px] sm:text-[12px] uppercase tracking-[0.2em] font-bold transition-all" onclick="switchTab('manage-requests')">Yêu Cầu Thuê</button>
        </div>

        <!-- Tab Quản lý phòng -->
        <div id="manage-rooms" class="tab-content active">
            <div class="grid grid-cols-1 xl:grid-cols-[.35fr_.65fr] gap-6 sm:gap-10">
                <!-- Form đăng phòng -->
                <div>
                    <div class="rounded-2xl border border-white/40 bg-white/40 p-5 sm:p-8 glass-smoke shadow-sm sticky top-[120px]">
                        <h2 class="text-3xl text-[#231f19] mb-6">Đăng Phòng Mới</h2>
                        <div id="msg-room" class="mb-4 text-center text-sm font-semibold hidden"></div>
                        <form id="roomForm" class="space-y-4">
                            <div>
                                <label class="block text-[11px] uppercase tracking-[0.15em] text-[#5b5247] mb-1">Tiêu đề</label>
                                <input type="text" id="title" required class="w-full rounded-xl border border-[#d8c1a3]/50 bg-white/60 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-[#8b7355] transition text-[#231f19]">
                            </div>
                            <div>
                                <label class="block text-[11px] uppercase tracking-[0.15em] text-[#5b5247] mb-1">Mô tả chi tiết</label>
                                <textarea id="description" rows="3" class="w-full rounded-xl border border-[#d8c1a3]/50 bg-white/60 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-[#8b7355] transition text-[#231f19]"></textarea>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-[11px] uppercase tracking-[0.15em] text-[#5b5247] mb-1">Giá (VNĐ)</label>
                                    <input type="number" id="price" required class="w-full rounded-xl border border-[#d8c1a3]/50 bg-white/60 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-[#8b7355] transition text-[#231f19]">
                                </div>
                                <div>
                                    <label class="block text-[11px] uppercase tracking-[0.15em] text-[#5b5247] mb-1">Diện tích (m²)</label>
                                    <input type="number" step="0.1" id="area" required class="w-full rounded-xl border border-[#d8c1a3]/50 bg-white/60 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-[#8b7355] transition text-[#231f19]">
                                </div>
                            </div>
                            <div>
                                <label class="block text-[11px] uppercase tracking-[0.15em] text-[#5b5247] mb-1">Địa chỉ</label>
                                <input type="text" id="address" required class="w-full rounded-xl border border-[#d8c1a3]/50 bg-white/60 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-[#8b7355] transition text-[#231f19]">
                            </div>
                            <div>
                                <label class="block text-[11px] uppercase tracking-[0.15em] text-[#5b5247] mb-1">Hình ảnh (URL hoặc File)</label>
                                <input type="text" id="imageUrl" placeholder="Nhập link ảnh https://..." class="w-full rounded-xl border border-[#d8c1a3]/50 bg-white/60 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-[#8b7355] transition mb-2 text-sm text-[#231f19]">
                                <input type="file" id="imageFile" accept="image/*" class="w-full text-sm text-[#5b5247] file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-[#5a4a3a] file:text-white hover:file:bg-[#4a3d30]">
                            </div>
                            <button type="submit" class="btn-primary w-full py-4 text-[11px] uppercase tracking-[0.25em] mt-4">
                                Lưu Phòng
                            </button>
                        </form>
                    </div>
                </div>
                
                <!-- Danh sách phòng -->
                <div>
                    <h2 class="text-4xl text-[#231f19] mb-6">Phòng Của Tôi</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="myRoomGrid">
                        <!-- Load by JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab Yêu cầu thuê -->
        <div id="manage-requests" class="tab-content">
            <h2 class="text-4xl text-[#231f19] mb-6 text-center">Danh Sách Người Muốn Thuê</h2>
            <div class="rounded-2xl border border-white/40 bg-white/40 p-4 sm:p-8 glass-smoke shadow-sm overflow-x-auto">
                <table class="w-full text-left border-collapse" id="requestsTable">
                    <thead>
                        <tr class="text-[11px] uppercase tracking-[0.15em] text-[#7a6b5c] border-b border-[#d8c1a3]/50">
                            <th class="py-4 font-semibold">Phòng</th>
                            <th class="py-4 font-semibold">Người thuê</th>
                            <th class="py-4 font-semibold">Số ĐT (Zalo)</th>
                            <th class="py-4 font-semibold">Ngày gửi</th>
                            <th class="py-4 font-semibold">Trạng thái</th>
                            <th class="py-4 font-semibold text-center">Hành động</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm">
                        <!-- Load by JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = getCurrentUser();
            if (!user || user.role !== 'LANDLORD') {
                window.location.href = 'login.html';
                return;
            }
            
            document.getElementById('nav-links').innerHTML = `
                <span class="text-xs sm:text-sm">Xin chào, ${user.fullName}</span>
                <button onclick="logout()" class="rounded-full px-4 sm:px-5 py-2 text-[10px] uppercase tracking-[0.1em] bg-red-600 text-white font-bold hover:bg-red-700 transition">Đăng xuất</button>
            `;

            loadMyRooms();
            loadRequests();
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            
            const btnRooms = document.getElementById('tab-manage-rooms');
            const btnReqs = document.getElementById('tab-manage-requests');
            
            if (tabId === 'manage-rooms') {
                btnRooms.className = 'tab-btn-active rounded-full px-6 sm:px-8 py-3 sm:py-4 text-[11px] sm:text-[12px] uppercase tracking-[0.2em] font-bold transition-all';
                btnReqs.className = 'tab-btn-inactive rounded-full px-6 sm:px-8 py-3 sm:py-4 text-[11px] sm:text-[12px] uppercase tracking-[0.2em] font-bold transition-all';
            } else {
                btnReqs.className = 'tab-btn-active rounded-full px-6 sm:px-8 py-3 sm:py-4 text-[11px] sm:text-[12px] uppercase tracking-[0.2em] font-bold transition-all';
                btnRooms.className = 'tab-btn-inactive rounded-full px-6 sm:px-8 py-3 sm:py-4 text-[11px] sm:text-[12px] uppercase tracking-[0.2em] font-bold transition-all';
            }
        }

        // --- ROOM MANAGEMENT ---
        document.getElementById('roomForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgEl = document.getElementById('msg-room');
            msgEl.style.display = 'block';
            msgEl.textContent = 'Đang lưu...';
            msgEl.className = 'mb-4 text-center text-sm font-semibold text-[#5b5247] block';
            
            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('price', document.getElementById('price').value);
            formData.append('area', document.getElementById('area').value);
            formData.append('address', document.getElementById('address').value);
            formData.append('imageUrl', document.getElementById('imageUrl').value);
            
            const fileInput = document.getElementById('imageFile');
            if (fileInput.files.length > 0) formData.append('imageFile', fileInput.files[0]);

            const res = await fetchAPI('/RoomFinder/api/rooms', 'POST', formData, true);
            if (res.success) {
                msgEl.textContent = 'Đăng phòng thành công!';
                msgEl.className = 'mb-4 text-center text-sm font-semibold text-green-700 block';
                document.getElementById('roomForm').reset();
                loadMyRooms();
                setTimeout(() => msgEl.style.display = 'none', 3000);
            } else {
                msgEl.textContent = res.message;
                msgEl.className = 'mb-4 text-center text-sm font-semibold text-red-600 block';
            }
        });

        async function loadMyRooms() {
            const user = getCurrentUser();
            const res = await fetchAPI(`/RoomFinder/api/rooms?landlordId=${user.id}`);
            const grid = document.getElementById('myRoomGrid');
            grid.innerHTML = '';
            
            if (res.success && res.data.length > 0) {
                res.data.forEach(room => {
                    let badgeClass = 'bg-gray-200 text-gray-700';
                    let statusText = room.status;
                    if (room.status === 'AVAILABLE') { badgeClass = 'bg-green-100 text-green-800'; statusText = 'CÒN TRỐNG'; }
                    else if (room.status === 'NEGOTIATING') { badgeClass = 'bg-yellow-100 text-yellow-800'; statusText = 'ĐANG ĐÀM PHÁN'; }
                    else if (room.status === 'RENTED') { badgeClass = 'bg-red-100 text-red-800'; statusText = 'ĐÃ CHO THUÊ'; }
                    
                    grid.innerHTML += `
                        <div class="rounded-2xl border border-white/40 bg-white/45 p-4 sm:p-5 glass-smoke flex flex-col transition hover:shadow-lg">
                            <img src="${room.imageUrl}" alt="${room.title}" onerror="this.src='https://via.placeholder.com/600x400?text=No+Image'" class="w-full h-40 object-cover rounded-xl mb-4">
                            <h3 class="text-lg sm:text-xl text-[#231f19] mb-1 font-semibold truncate">${room.title}</h3>
                            <p class="text-xs text-[#4a4339] mb-1"><strong>Giá:</strong> ${formatCurrency(room.price)}/th</p>
                            <div class="flex justify-between items-center mb-4">
                                <span class="px-2 py-1 rounded-full text-[10px] font-bold ${badgeClass}">${statusText}</span>
                            </div>
                            <div class="mt-auto flex gap-2">
                                ${room.status !== 'RENTED' ? `<button class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-full text-[10px] uppercase tracking-wider font-bold transition" onclick="markAsRented(${room.id})">Đã Thuê</button>` : ''}
                                <button class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-full text-[10px] uppercase tracking-wider font-bold transition" onclick="deleteRoom(${room.id})">Xóa</button>
                            </div>
                        </div>
                    `;
                });
            } else {
                grid.innerHTML = '<p class="text-[#4a4339]">Bạn chưa đăng phòng nào.</p>';
            }
        }

        async function markAsRented(roomId) {
            if (confirm('Xác nhận phòng này đã được thuê xong?')) {
                const res = await fetchAPI('/RoomFinder/api/rooms/status', 'PUT', { id: roomId, status: 'RENTED' });
                if (res.success) loadMyRooms();
                else alert(res.message);
            }
        }

        async function deleteRoom(roomId) {
            if (confirm('Bạn có chắc chắn muốn xóa phòng này? Dữ liệu không thể phục hồi!')) {
                const res = await fetchAPI(`/RoomFinder/api/rooms?id=${roomId}`, 'DELETE');
                if (res.success) loadMyRooms();
                else alert(res.message);
            }
        }

        // --- REQUEST MANAGEMENT ---
        async function loadRequests() {
            const res = await fetchAPI('/RoomFinder/api/requests');
            const tbody = document.querySelector('#requestsTable tbody');
            tbody.innerHTML = '';
            
            if (res.success && res.data.length > 0) {
                res.data.forEach(req => {
                    let badgeClass = 'bg-gray-100 text-gray-700';
                    let statusText = req.status;
                    if (req.status === 'APPROVED') { badgeClass = 'bg-green-100 text-green-800'; statusText = 'ĐÃ DUYỆT'; }
                    else if (req.status === 'REJECTED') { badgeClass = 'bg-red-100 text-red-800'; statusText = 'TỪ CHỐI'; }
                    else if (req.status === 'PENDING') { badgeClass = 'bg-yellow-100 text-yellow-800'; statusText = 'ĐANG CHỜ'; }
                    
                    let actions = '-';
                    if (req.status === 'PENDING') {
                        actions = `
                            <div class="flex gap-2 justify-center">
                                <button class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-full text-[10px] uppercase font-bold transition" onclick="updateRequest(${req.id}, 'APPROVED')">Duyệt</button>
                                <button class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-full text-[10px] uppercase font-bold transition" onclick="updateRequest(${req.id}, 'REJECTED')">Từ chối</button>
                            </div>
                        `;
                    }
                    
                    tbody.innerHTML += `
                        <tr class="border-b border-white/40 last:border-0">
                            <td class="py-4 text-[#4a4339] max-w-[200px] truncate" title="${req.roomTitle}">${req.roomTitle}</td>
                            <td class="py-4 text-[#4a4339]">${req.renterName}</td>
                            <td class="py-4 text-[#4a4339]"><a href="https://zalo.me/${req.renterPhone}" target="_blank" class="text-blue-600 hover:underline font-bold">${req.renterPhone}</a></td>
                            <td class="py-4 text-[#4a4339]">${new Date(req.createdAt).toLocaleDateString('vi-VN')}</td>
                            <td class="py-4"><span class="px-2 py-1 rounded-full text-xs font-bold ${badgeClass}">${statusText}</span></td>
                            <td class="py-4 text-center">${actions}</td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="6" class="py-6 text-center text-[#4a4339]">Chưa có yêu cầu nào.</td></tr>';
            }
        }

        async function updateRequest(reqId, status) {
            if (confirm(`Bạn có chắc muốn ${status === 'APPROVED' ? 'DUYỆT' : 'TỪ CHỐI'} yêu cầu này?`)) {
                const res = await fetchAPI('/RoomFinder/api/requests/status', 'PUT', { id: reqId, status: status });
                if (res.success) {
                    loadRequests();
                    loadMyRooms();
                } else {
                    alert(res.message);
                }
            }
        }
    </script>
</body>
</html>
