<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Giao dịch</title><link rel="stylesheet" href="css/style.css"></head>
<body><div id="nav"></div><main class="container"><div class="page-head"><div><p class="eyebrow">Sổ thu chi</p><h1>Giao dịch</h1></div></div>
<section class="card"><h2 id="form-title">Thêm giao dịch</h2><form id="transaction-form" class="form-grid"><input type="hidden" id="transaction-id"><div class="field"><label for="amount">Số tiền (VND)</label><input id="amount" type="number" min="1" required></div><div class="field"><label for="type">Loại giao dịch</label><select id="type"><option value="EXPENSE">Chi tiêu</option><option value="INCOME">Thu nhập</option></select></div><div class="field full"><label for="description">Mô tả</label><input id="description" required maxlength="255"></div><div class="field"><label for="transaction-date">Ngày giao dịch</label><input id="transaction-date" type="date" required></div><div class="field"><label for="category-id">Danh mục</label><select id="category-id" required></select></div><div class="field"><label for="payment-method-id">Phương thức thanh toán</label><select id="payment-method-id"></select></div><div class="field full"><label for="note">Ghi chú</label><textarea id="note"></textarea></div><div><button class="btn primary" type="submit">Lưu giao dịch</button> <button class="btn" id="cancel-edit" type="button" hidden>Hủy sửa</button></div></form></section>
<section class="card"><div class="section-head"><h2>Lịch sử giao dịch</h2></div><div class="toolbar"><input id="search" placeholder="Tìm theo mô tả"><select id="filter-type"><option value="">Tất cả loại</option><option value="INCOME">Tiền vào</option><option value="EXPENSE">Tiền ra</option></select><input id="from-date" type="date"><input id="to-date" type="date"><button class="btn" id="filter-btn">Lọc</button></div><div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Mô tả</th><th>Loại</th><th>Danh mục</th><th>Thanh toán</th><th>Số tiền</th><th></th></tr></thead><tbody id="transaction-rows"></tbody></table></div></section></main><div id="toast-box"></div><script src="js/common.js"></script><script src="js/transactions.js"></script></body></html>
